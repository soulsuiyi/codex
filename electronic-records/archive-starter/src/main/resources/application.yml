server:
  port: 8080

spring:
  application:
    name: archive-system
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/h2/archive
    username: sa
    password: qazwsx112234
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.archive.core.mapper: debug
    com.archive.auth.mapper: debug

springdoc:
  packages-to-scan: com.archive.api.controller
  paths-to-match: /api/v1/**

knife4j:
  enable: true

sa-token:
  token-name: Authorization
  timeout: 7200
  active-timeout: -1
  is-concurrent: false
  is-share: false
  token-style: uuid
  is-log: false
