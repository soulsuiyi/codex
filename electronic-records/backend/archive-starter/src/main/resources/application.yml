server:
  port: 8080

spring:
  application:
    name: archive-system
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/h2/archive
    username: sa
    password: qazwsx112234
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.archive.core.mapper: debug
    com.archive.auth.mapper: debug

springdoc:
  packages-to-scan: com.archive.api.controller
  paths-to-match: /api/v1/**

knife4j:
  enable: true

sa-token:
  token-name: Authorization
  timeout: 7200
  active-timeout: -1
  is-concurrent: false
  is-share: false
  token-style: uuid
  is-log: false

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: 无纸化办案电子档案系统
    version: 0.1.0-SNAPSHOT

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  buckets:
    transit: ${MINIO_TRANSIT_BUCKET:transit-bucket}
    archive: ${MINIO_ARCHIVE_BUCKET:archive-bucket}
    preview: ${MINIO_PREVIEW_BUCKET:preview-bucket}

archive:
  ocr:
    command: ${ARCHIVE_OCR_COMMAND:tesseract}
  convert:
    command: ${ARCHIVE_OFFICE_COMMAND:soffice}
  media:
    ffmpeg-command: ${ARCHIVE_FFMPEG_COMMAND:ffmpeg}
  watermark:
    font-path: "${ARCHIVE_WATERMARK_FONT_PATH:C:/Windows/Fonts/simhei.ttf}"
